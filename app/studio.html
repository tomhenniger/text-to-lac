<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Layer-Studio — Handschrift</title>
<style>
  :root {
    --bg: #f4f6f5; --panel: #fcfdfc; --border: #d8ddda; --text: #1b201d;
    --muted: #68716c; --accent: #00ae42; --accent-dark: #008f36; --hover: #eef1ef;
  }
  html[data-theme="dark"] {
    --bg: #141715; --panel: #1d2220; --border: #343b37; --text: #e6eae7;
    --muted: #98a29c; --hover: #272d2a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg);
         color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 13px; }
  /* Menüleiste */
  #menubar { display: flex; align-items: center; gap: 2px; height: 34px; padding: 0 8px; background: var(--panel);
             border-bottom: 1px solid var(--border); flex: none; position: relative; z-index: 100; }
  .menubtn { padding: 5px 10px; border: 0; background: none; color: var(--text); font-size: 13px; border-radius: 5px; cursor: pointer; }
  .menubtn:hover, .menubtn.open { background: var(--hover); }
  #menubar .sp { flex: 1; }
  #menubar .nav, #menubar .tb { width: 30px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
              border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--muted); cursor: pointer; text-decoration: none; padding: 0; font-size: 12px; }
  #menubar .nav:hover, #menubar .tb:hover { border-color: var(--accent); color: var(--text); }
  .menu { position: absolute; top: 32px; min-width: 210px; background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 5px; display: none; z-index: 101; }
  .menu.open { display: block; }
  .menu .mi { padding: 6px 10px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .menu .mi:hover { background: var(--hover); }
  .menu .chk { width: 14px; color: var(--accent); flex: none; }
  .menu .sep { height: 1px; background: var(--border); margin: 5px 4px; }
  /* Arbeitsbereich */
  #workspace { flex: 1; display: flex; min-height: 0; position: relative; }
  #toolbar { width: 54px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
             padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; overflow-y: auto; scrollbar-width: thin; scroll-behavior: smooth; }
  #toolbar::-webkit-scrollbar { width: 6px; }
  #toolbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #toolbar:hover::-webkit-scrollbar-thumb { background: var(--muted); }
  #tbScroll { position: absolute; left: 0; bottom: 0; width: 54px; height: 22px; pointer-events: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; font-size: 11px; color: var(--muted);
              background: linear-gradient(to bottom, transparent, var(--panel)); opacity: 0; transition: opacity .15s; }
  #tbScroll.show { opacity: 1; }
  .toolbtn { width: 40px; height: 40px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--text);
             cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .toolbtn:hover { background: var(--hover); border-color: var(--border); }
  .toolbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tbsep { width: 28px; height: 1px; background: var(--border); margin: 3px 0; }
  #main { flex: 1; position: relative; min-width: 0; background: #e9ece9; }   /* heller Arbeitsbereich (Papier-Desk), unabhängig vom Theme */
  html[data-theme="dark"] #main { background: #e9ece9; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  /* Rechtes Panel */
  #rightpanel { width: 360px; flex: none; background: var(--panel); border-left: 1px solid var(--border);
                display: flex; flex-direction: column; min-height: 0; }
  .panelhead { padding: 8px 12px; font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .panelhead .sp { flex: 1; }
  #layersPanel { display: flex; flex-direction: column; max-height: 42%; min-height: 120px; border-bottom: 1px solid var(--border); }
  #layersBody { overflow-y: auto; padding: 8px 10px; }
  #layerList { display: flex; flex-direction: column; gap: 4px; }
  .lrow { display: flex; align-items: center; gap: 6px; padding: 5px 7px; border: 1px solid var(--border);
          border-radius: 6px; font-size: 12.5px; cursor: pointer; background: var(--panel); }
  .lrow.sel { border-color: var(--accent); background: var(--hover); }
  .lrow .ln { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .ic { width: 24px; height: 24px; padding: 0; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .lrow .ic:hover { color: var(--text); }
  .lrow .lti { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 18px; }
  .lrow .lnedit { flex: 1; min-width: 0; padding: 2px 5px; font-size: 12.5px; }
  .lrow .sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--border); flex: none; }
  .lrow.primary { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .aligngrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; }
  .aligngrid.dist { grid-template-columns: repeat(2, 1fr); }
  .abtn { height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .abtn:hover:not([disabled]) { border-color: var(--accent); }
  .abtn[disabled] { opacity: .38; cursor: default; }
  #propsPanel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #propsForm { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  #editorBody { flex: 1; position: relative; min-height: 0; }
  .toolframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  .toolframe.active { display: block; }
  /* gemeinsame Inputs */
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  label:first-child { margin-top: 0; }
  select, input[type=text], input[type=number] { width: 100%; padding: 6px 8px; font-size: 13px;
             border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; }
  button { padding: 7px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { background: var(--hover); }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 6px; }
  .btnrow { display: flex; gap: 8px; margin-top: 8px; } .btnrow button { flex: 1; }
  #statusbar { flex: none; padding: 4px 12px; font-size: 11px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--border); }
  /* Options-/Ausricht-Leiste oben (Photoshop-Stil) */
  #optionsbar { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px; background: var(--panel);
                border-bottom: 1px solid var(--border); flex: none; overflow-x: auto; }
  #optionsbar .obLabel { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #optionsbar select { width: auto; min-width: 118px; padding: 4px 8px; }
  #optionsbar select:disabled { opacity: .5; }
  .obsep { width: 1px; height: 22px; background: var(--border); margin: 0 3px; flex: none; }
  .abar { display: flex; gap: 4px; }
  #optionsbar .abtn { width: 32px; }
  #optionsbar select { min-width: 96px; }
  #obCtx { display: none; align-items: center; gap: 6px; }
  #optionsbar .obgrp { display: inline-flex; align-items: center; gap: 6px; }
  #optionsbar .obf { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  #optionsbar .obf input[type=number] { width: 52px; padding: 4px 5px; }
  #optionsbar .obf input:disabled { opacity: .5; }
  #optionsbar .oblock { display: inline-flex; align-items: center; color: var(--muted); opacity: .6; margin: 0 -1px; }
  #optionsbar .obf input[type=checkbox] { width: auto; }
  #optionsbar input[type=color] { width: 30px; height: 26px; padding: 0; border-radius: 6px; flex: none; }
  #optionsbar .obbtn { padding: 5px 9px; white-space: nowrap; }
  /* einklappbare Panels */
  .panelhead { cursor: pointer; user-select: none; }
  .panelhead .chev { width: 8px; height: 8px; margin-right: 8px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted);
                     transform: rotate(45deg); transition: transform .15s; flex: none; }
  .panel-collapsed .panelhead .chev { transform: rotate(-45deg); }
  #layersPanel.panel-collapsed { min-height: 0; max-height: none; flex: none; }
  #layersPanel.panel-collapsed #layersBody { display: none; }
  #propsPanel.panel-collapsed #editorBody { display: none; }
  /* eigene Modals (kein Browser-Standard) */
  #modalBack { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 300; }
  #modalBack.open { display: flex; }
  #modalCard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 14px 44px rgba(0,0,0,.35); padding: 18px 18px 16px; min-width: 320px; max-width: 92vw; }
  #modalCard .mtitle { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  #modalCard .mmsg { font-size: 13px; line-height: 1.5; color: var(--text); white-space: pre-wrap; margin-bottom: 12px; }
  #modalCard input[type=text] { width: 100%; margin-bottom: 12px; }
  #modalCard .mbtns { display: flex; gap: 8px; justify-content: flex-end; }
  #modalCard .mbtns button { min-width: 88px; }
  #modalCard .mbtns .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #modalCard .mbtns .primary:hover { background: var(--accent-dark); }
  #hidden { display: none; }
</style>
</head>
<body>
<div id="menubar">
  <button class="menubtn" data-menu="file">Datei</button>
  <button class="menubtn" data-menu="edit">Bearbeiten</button>
  <button class="menubtn" data-menu="view">Ansicht</button>
  <span class="sp"></span>
  <a class="nav" href="../index.html" title="Home" data-icon="home"></a>
  <button class="tb" id="btnLang">EN</button>
  <button class="tb" id="btnTheme"></button>
</div>

<div id="optionsbar">
  <span class="obLabel" id="obNoSel">Keine Ebene ausgewählt — Werkzeug links wählen oder Ebene anklicken.</span>
  <div id="obCtx">
    <span class="obgrp" id="obXform">
      <span class="obf">X<input type="number" id="inLx" step="1"></span>
      <span class="obf">Y<input type="number" id="inLy" step="1"></span>
      <span class="obf" title="Breite (mm)">↔<input type="number" id="inLw" step="1" min="1"></span>
      <span class="oblock" id="obAspect" title="Breite & Höhe sind proportional gekoppelt (gleichmäßige Skalierung)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
      <span class="obf" title="Höhe (mm)">↕<input type="number" id="inLh" step="1" min="1"></span>
      <span class="obf" title="Drehung (°)">∠<input type="number" id="inLr" step="1"></span>
      <span class="obsep"></span>
    </span>
    <span class="obgrp" id="obModelRot" style="display:none">
      <span class="obf">3D&nbsp;X<input type="number" id="inLrx" step="1"></span>
      <span class="obf">Y<input type="number" id="inLry" step="1"></span>
      <span class="obf">Z<input type="number" id="inLrz" step="1"></span>
      <span class="obsep"></span>
    </span>
    <span class="obgrp" id="obSingle">
      <select id="inLmode" title="Plotter-Modus">
        <option value="KCPenDraw">Zeichnen</option>
        <option value="KCPenDrawFill">Ausmalen</option>
        <option value="KCBasicCut">Schneiden</option>
      </select>
      <label class="obf"><input type="checkbox" id="inLcolorOn">Farbe</label>
      <input type="color" id="inLcolor" value="#000000">
      <span class="obsep"></span>
    </span>
    <span class="obLabel">Ausrichten</span>
    <select id="alignRef">
      <option value="selection">Auswahl</option>
      <option value="area">Arbeitsfläche</option>
      <option value="sheet">Blatt</option>
    </select>
    <div class="abar" id="alignRow"></div>
    <div class="abar" id="distRow"></div>
    <span class="obsep"></span>
    <button class="obbtn" id="btnDup">Duplizieren</button>
    <button class="obbtn" id="btnDel">Löschen</button>
    <span class="obLabel" id="obSelInfo" style="margin-left:auto"></span>
  </div>
</div>

<div id="workspace">
  <div id="toolbar"></div>
  <div id="tbScroll">▾</div>
  <div id="main"><canvas id="cv"></canvas></div>
  <div id="rightpanel">
    <div id="layersPanel">
      <div class="panelhead"><span class="chev"></span>Ebenen</div>
      <div id="layersBody">
        <div id="layerList"></div>
        <div class="hint" id="layerHint">Noch keine Ebenen. Werkzeug links anklicken, um eine Ebene anzulegen, dann auf der Fläche ziehen.</div>
      </div>
    </div>
    <div id="propsPanel">
      <div class="panelhead"><span class="chev"></span>Werkzeug <span class="sp"></span><span id="propLabel" style="font-weight:400;color:var(--muted)"></span></div>
      <div id="editorBody"></div>
    </div>
  </div>
</div>
<div id="statusbar"><span id="stInfo">Bereit</span><span id="warnInfo" style="color:#e2603b;margin-left:14px;font-weight:600"></span></div>
<div id="modalBack"><div id="modalCard"></div></div>

<div id="hidden">
  <input type="number" id="inMatW" value="300"><input type="number" id="inMatH" value="300">
  <select id="inPaper"><option value="none">keins</option><option value="A4P" selected>A4 hoch</option><option value="A4L">A4 quer</option><option value="A5P">A5 hoch</option><option value="A3P">A3 hoch</option><option value="Letter">Letter</option></select>
  <input type="checkbox" id="inSnap" checked>
  <input type="text" id="inFname" value="Komposition">
  <input type="file" id="fileLoad" accept=".handschrift,application/json">
</div>

<script src="configs.js"></script>
<script src="lac.js?v=4"></script>
<script src="ui.js?v=7"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");

const PAPERS = { none: null, A4P: [210, 297], A4L: [297, 210], A5P: [148, 210], A3P: [297, 420], Letter: [215.9, 279.4] };
const MACHINE = { draw: [300, 255], cut: [300, 285] };   // A2L: Zeichen- bzw. Schneidebereich (mm), ab Ursprung oben links
const MISC_TOOLS = [["shapes","Grundformen","Basic shapes"],["qr","QR-Code","QR code"],["spotify","Spotify-Code","Spotify code"],["svg","SVG-Import","SVG import"],["paper","Papier / Raster","Paper / grid"],
  ["pentest","Stift-Test","Pen test"],["spacefill","Space-Filling-Kurven","Space-filling curves"],["spiro","Spirograph / Lissajous","Spirograph / Lissajous"],
  ["maze","Labyrinth","Maze"],["fxplot","Funktionsplotter","Function plotter"],["tsp","TSP- / Stipple-Art","TSP / stipple art"],["wave","Audio-Waveform","Audio waveform"]];
function toolLabel(t){ if(t==="model") return UI.t("3D-Modell","3D model"); const m=MISC_TOOLS.find(x=>x[0]===t); return m?UI.t(m[1],m[2]):t; }
function layerLabel(L){ return L.type==="text"?UI.t("Text","Text"):L.type==="image"?UI.t("Bild","Image"):L.type==="pen"?UI.t("Pfad/Freihand","Path/Freehand"):toolLabel(L.tool); }

const S = { matW: 300, matH: 300, view: { scale: 1, ox: 0, oy: 0 }, layers: [], selId: null, selIds: [], paper: "A4P", snap: true, bg: "#ffffff", guides: true, tool: "select" };
let LID = 1, LSEQ = 0;
let snapGuides = null;

function makeLayer(type, tool) {
  return { id: LID++, type, tool: tool || null, name: "Layer " + (LSEQ++),
    visible: true, transform: { x: 40, y: 40, scale: 1, rot: 0 }, params: null,
    strokesCache: [], groups: null, cw: 0, ch: 0, color: null, mode: "KCPenDraw", modelEuler: null, _frame: null };
}
function isModelLayer(L) { return !!L && L.type === "misc" && L.tool === "model"; }
function isPenLayer(L) { return !!L && L.type === "pen"; }
/* ---------- Pfad-/Stift-Geometrie (nativ auf dem Canvas) ---------- */
function cubic(p0, p1, p2, p3, t) { const u = 1 - t, w0 = u * u * u, w1 = 3 * u * u * t, w2 = 3 * u * t * t, w3 = t * t * t; return [w0 * p0[0] + w1 * p1[0] + w2 * p2[0] + w3 * p3[0], w0 * p0[1] + w1 * p1[1] + w2 * p2[1] + w3 * p3[1]]; }
function penFlatten(pen) {                              // → eine Polylinie (Content-Koordinaten)
  if (!pen) return [];
  if (pen.kind === "free") return pen.poly && pen.poly.length >= 2 ? [pen.poly.map(p => p.slice())] : [];
  const A = pen.anchors; if (!A || A.length < 2) return [];
  const n = A.length, segs = pen.closed ? n : n - 1, pts = [[A[0].x, A[0].y]];
  for (let i = 0; i < segs; i++) {
    const a = A[i], b = A[(i + 1) % n];
    const c1 = a.hOut ? [a.x + a.hOut[0], a.y + a.hOut[1]] : [a.x, a.y];
    const c2 = b.hIn ? [b.x + b.hIn[0], b.y + b.hIn[1]] : [b.x, b.y];
    const straight = !a.hOut && !b.hIn;
    if (straight) { pts.push([b.x, b.y]); continue; }
    for (let s = 1; s <= 16; s++) pts.push(cubic([a.x, a.y], c1, c2, [b.x, b.y], s / 16));
  }
  return [pts];
}
function penBBox(pen) {   // Bounding-Box der gerenderten Polylinie
  const poly = penFlatten(pen)[0] || []; let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
  for (const [x, y] of poly) { if (x < mnx) mnx = x; if (y < mny) mny = y; if (x > mxx) mxx = x; if (y > mxy) mxy = y; }
  return poly.length ? { minX: mnx, minY: mny, maxX: mxx, maxY: mxy } : { minX: 0, minY: 0, maxX: 0, maxY: 0 };
}
function penRecompute(L) {   // Striche + Maße aus L.pen neu berechnen (Anker in Content-Koordinaten)
  L.strokesCache = penFlatten(L.pen);
  const b = penBBox(L.pen);
  L.cw = Math.max(b.maxX, 0.5); L.ch = Math.max(b.maxY, 0.5);   // Anker liegen ab Ursprung; Maße = max-Ausdehnung
}
function makePenLayer(pen, name) {
  const L = makeLayer("pen", null); L.pen = pen; if (name) L.name = name;
  L.transform = { x: 0, y: 0, scale: 1, rot: 0 };
  penRecompute(L); return L;
}
function mat2content(L, mx, my) {   // Mausposition (mm auf Matte) → Content-Koordinaten der Ebene (inverse Transform)
  const t = L.transform, sc = t.scale, cx = t.x + (L.cw / 2) * sc, cy = t.y + (L.ch / 2) * sc;
  const cos = Math.cos(-t.rot), sin = Math.sin(-t.rot), dx = mx - cx, dy = my - cy;
  const Xr = cx + dx * cos - dy * sin, Yr = cy + dx * sin + dy * cos;
  return [(Xr - t.x) / sc, (Yr - t.y) / sc];
}
function hexToRgbStr(hex) { const n = parseInt(hex.slice(1), 16); return (n >> 16 & 255) + " " + (n >> 8 & 255) + " " + (n & 255) + " 255"; }
function rgbStrToHex(c) { const p = (c || "").split(" "); const h = v => (+v || 0).toString(16).padStart(2, "0"); return "#" + h(p[0]) + h(p[1]) + h(p[2]); }
function embedUrl(L) {
  const base = L.type === "text" ? "index.html?embed=1" : L.type === "image" ? "bild.html?embed=1" : "misc.html?embed=1&tool=" + L.tool;
  return base + "&v=3";   // Cache-Bust für die eingebettete Tool-HTML (hasSource-Flag)
}

/* ---------- Transform-Math ---------- */
function layerMap(L) {
  const t = L.transform, sc = t.scale, rot = t.rot;
  const cx = t.x + (L.cw / 2) * sc, cy = t.y + (L.ch / 2) * sc;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  return ([px, py]) => { const X = t.x + px * sc, Y = t.y + py * sc, dx = X - cx, dy = Y - cy; return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos]; };
}
function layerCorners(L) { const f = layerMap(L); return [[0, 0], [L.cw, 0], [L.cw, L.ch], [0, L.ch]].map(f); }
function layerAABB(L) { const c = layerCorners(L); const xs = c.map(p => p[0]), ys = c.map(p => p[1]); return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) }; }
function pointInLayer(L, mx, my) {
  if (!L.cw || !L.ch) return false;
  const t = L.transform, sc = t.scale;
  const cx = t.x + (L.cw / 2) * sc, cy = t.y + (L.ch / 2) * sc;
  const cos = Math.cos(-t.rot), sin = Math.sin(-t.rot), dx = mx - cx, dy = my - cy;
  const Xr = cx + dx * cos - dy * sin, Yr = cy + dx * sin + dy * cos;
  const px = (Xr - t.x) / sc, py = (Yr - t.y) / sc;
  return px >= -1 && px <= L.cw + 1 && py >= -1 && py <= L.ch + 1;
}

/* ---------- Vorschau ---------- */
const mm2px = (x, y) => [(x * S.view.scale + S.view.ox) * devicePixelRatio, (y * S.view.scale + S.view.oy) * devicePixelRatio];
const px2mm = (x, y) => [(x - S.view.ox) / S.view.scale, (y - S.view.oy) / S.view.scale];
function groupColor(c, fallback) { if (!c) return fallback; const p = c.split(" "); return `rgb(${p[0]},${p[1]},${p[2]})`; }

function alignTargetBounds() {
  const ref = $("alignRef").value;
  if (ref === "area") return { minX: 0, minY: 0, maxX: S.matW, maxY: S.matH };
  if (ref === "sheet") { const pa = PAPERS[S.paper]; if (pa) { const ox = (S.matW - pa[0]) / 2, oy = (S.matH - pa[1]) / 2; return { minX: ox, minY: oy, maxX: ox + pa[0], maxY: oy + pa[1] }; } return { minX: 0, minY: 0, maxX: S.matW, maxY: S.matH }; }
  return unionAABB(selLayers().filter(L => L.cw && L.ch));   // "selection"
}
function alignLayers(edge) {
  const Ls = selLayers().filter(L => L.cw && L.ch); if (!Ls.length) return;
  const T = alignTargetBounds();
  for (const L of Ls) {
    const a = layerAABB(L); let dx = 0, dy = 0;
    if (edge === "left") dx = T.minX - a.minX;
    else if (edge === "hcenter") dx = (T.minX + T.maxX) / 2 - (a.minX + a.maxX) / 2;
    else if (edge === "right") dx = T.maxX - a.maxX;
    else if (edge === "top") dy = T.minY - a.minY;
    else if (edge === "vcenter") dy = (T.minY + T.maxY) / 2 - (a.minY + a.maxY) / 2;
    else if (edge === "bottom") dy = T.maxY - a.maxY;
    L.transform.x += dx; L.transform.y += dy;
  }
  syncSelInputs(); renderList(); redraw();
  setStatus(Ls.length + " " + UI.t("Ebenen ausgerichtet", "layers aligned"));
}
function distribute(axis) {
  const Ls = selLayers().filter(L => L.cw && L.ch); if (Ls.length < 3) return;
  const ref = $("alignRef").value, T = alignTargetBounds();
  const items = Ls.map(L => ({ L, a: layerAABB(L) }));
  if (axis === "h") {
    items.sort((p, q) => (p.a.minX + p.a.maxX) / 2 - (q.a.minX + q.a.maxX) / 2);
    const left = ref === "selection" ? Math.min(...items.map(it => it.a.minX)) : T.minX, right = ref === "selection" ? Math.max(...items.map(it => it.a.maxX)) : T.maxX;
    const totalW = items.reduce((s, it) => s + (it.a.maxX - it.a.minX), 0), gap = (right - left - totalW) / (items.length - 1);
    let cur = left; for (const it of items) { const w = it.a.maxX - it.a.minX; it.L.transform.x += cur - it.a.minX; cur += w + gap; }
  } else {
    items.sort((p, q) => (p.a.minY + p.a.maxY) / 2 - (q.a.minY + q.a.maxY) / 2);
    const top = ref === "selection" ? Math.min(...items.map(it => it.a.minY)) : T.minY, bot = ref === "selection" ? Math.max(...items.map(it => it.a.maxY)) : T.maxY;
    const totalH = items.reduce((s, it) => s + (it.a.maxY - it.a.minY), 0), gap = (bot - top - totalH) / (items.length - 1);
    let cur = top; for (const it of items) { const h = it.a.maxY - it.a.minY; it.L.transform.y += cur - it.a.minY; cur += h + gap; }
  }
  syncSelInputs(); renderList(); redraw();
  setStatus(Ls.length + " " + UI.t("Ebenen verteilt", "layers distributed"));
}

window.addEventListener("message", e => {
  const m = e.data; if (!m || m.source !== "ttl-tool") return;
  const L = S.layers.find(x => x._frame && x._frame.contentWindow === e.source);
  if (!L) return;
  if (m.type === "ready") {
    if (L._pendingParams) { L._frame.contentWindow.postMessage({ source: "ttl-studio", type: "restoreParams", params: L._pendingParams }, "*"); L._pendingParams = null; }
    // Theme + Sprache syncen
    L._frame.contentWindow.postMessage({ source: "ttl-studio", type: "setTheme", theme: UI.theme() }, "*");
    L._frame.contentWindow.postMessage({ source: "ttl-studio", type: "setLang", lang: UI.lang() }, "*");
    if (isModelLayer(L)) L._frame.contentWindow.postMessage({ source: "ttl-studio", type: "requestModelState" }, "*");   // 3D-Drehung holen, sobald das iframe bereit ist
  } else if (m.type === "strokes") {
    const incoming = (m.groups && m.groups.length) ? m.groups.flatMap(g => g.polylines) : [];
    // Wiederhergestellte Ebene (Striche aus dem Cache, iframe gerade erst erzeugt): das frische iframe meldet beim Laden

    // leeren Stand NICHT übernehmen, sonst verschwinden die wiederhergestellten Striche beim Auswählen der Ebene.
    if (L._restored && incoming.length === 0 && L.strokesCache.length > 0 && !m.hasSource) return;   // nur den leeren Anfangsstand ohne geladene Quelle ignorieren; „Quelle geladen, aber leer" zählt
    L._restored = false;   // ab jetzt liefert das iframe die maßgeblichen Striche
    L.groups = m.groups || null;
    L.strokesCache = incoming;
    L.cw = m.cw || 0; L.ch = m.ch || 0; L.params = m.params;
    if (sel() === L) updatePropsUI();   // Striche jetzt da → Ausricht-/Verteil-Buttons sofort aktivieren (nicht erst nach Re-Select)
    scheduleRedraw(); renderList(); setStatus(S.layers.length + " Layer · ausgewählt: " + (sel() ? sel().name : "–"));
  } else if (m.type === "modelState") {                 // aktuelle 3D-Drehung des Modells → Zahlenfelder

function buildGroups() {

    groups.forEach(g => { const polys = g.polylines.map(st => st.map(f)).filter(st => st.length >= 2);

}

}

let openMenu = null;
function closeMenu() { openMenu = null; dd.classList.remove("open"); document.querySelectorAll(".menubtn.open").forEach(b => b.classList.remove("open")); }
function showMenu(btn) {
  const key = btn.dataset.menu; if (openMenu === key) { closeMenu(); return; }
  closeMenu(); openMenu = key; dd.innerHTML = "";
  for (const it of MENUS[key]()) {
    if (it.sep) { const s = document.createElement("div"); s.className = "sep"; dd.appendChild(s); continue; }
    const mi = document.createElement("div"); mi.className = "mi";
    mi.innerHTML = '<span class="chk">' + (it.chk ? "✓" : "") + '</span><span>' + it.l + '</span>';
    mi.onclick = () => { closeMenu(); it.a(); };
    dd.appendChild(mi);
  }
  const r = btn.getBoundingClientRect(); dd.style.left = r.left + "px"; dd.classList.add("open"); btn.classList.add("open");
}

// Tastatur: Entf löscht Auswahl, Cmd/Ctrl+S speichert, Cmd/Ctrl+A wählt alles, Esc hebt auf, Pfeile verschieben
const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
window.addEventListener("keydown", e => {
  if ($("modalBack").classList.contains("open")) return;   // Modal offen → globale Shortcuts pausieren
  if (penDraft || penEdit || freeDraft) {                   // aktives Zeichnen: Enter/Esc/Backspace zuerst
    if (e.key === "Enter") { e.preventDefault(); if (penDraft) finishPen(); else if (penEdit) finishPenEdit(); return; }
    if (e.key === "Escape") { e.preventDefault(); if (penDraft) { penDraft = null; penDrag = null; redraw(); } else if (penEdit) finishPenEdit(); else { freeDraft = null; redraw(); } return; }
    if ((e.key === "Backspace" || e.key === "Delete") && penDraft) { e.preventDefault(); penDraft.anchors.pop(); if (!penDraft.anchors.length) penDraft = null; redraw(); return; }
  }
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveLayout(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "a") { e.preventDefault(); selectAll(); }
  else if ((e.key === "Delete" || e.key === "Backspace") && S.selIds.length) { e.preventDefault(); deleteSelected(); }
  else if (e.key === "Escape") { e.preventDefault(); if (S.tool !== "select") setTool("select"); else if (S.selIds.length) selectLayer(null); }
  else if (ARROWS[e.key] && S.selIds.length) {
    e.preventDefault(); const step = e.shiftKey ? 10 : 1, [dx, dy] = ARROWS[e.key];
    selLayers().forEach(L => { L.transform.x += dx * step; L.transform.y += dy * step; });
    syncSelInputs(); redraw(); markDirty();
  }
});
