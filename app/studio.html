<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Layer-Studio — Handschrift</title>
<style>
  :root {
    --bg: #f4f6f5; --panel: #fcfdfc; --border: #d8ddda; --text: #1b201d;
    --muted: #68716c; --accent: #00ae42; --accent-dark: #008f36; --hover: #eef1ef;
  }
  html[data-theme="dark"] {
    --bg: #141715; --panel: #1d2220; --border: #343b37; --text: #e6eae7;
    --muted: #98a29c; --hover: #272d2a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg);
         color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 13px; }
  /* Menüleiste */
  #menubar { display: flex; align-items: center; gap: 2px; height: 34px; padding: 0 8px; background: var(--panel);
             border-bottom: 1px solid var(--border); flex: none; position: relative; z-index: 100; }
  .menubtn { padding: 5px 10px; border: 0; background: none; color: var(--text); font-size: 13px; border-radius: 5px; cursor: pointer; }
  .menubtn:hover, .menubtn.open { background: var(--hover); }
  #menubar .sp { flex: 1; }
  #menubar .nav, #menubar .tb { width: 30px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
              border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--muted); cursor: pointer; text-decoration: none; padding: 0; font-size: 12px; }
  #menubar .nav:hover, #menubar .tb:hover { border-color: var(--accent); color: var(--text); }
  .menu { position: absolute; top: 32px; min-width: 210px; background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 5px; display: none; z-index: 101; }
  .menu.open { display: block; }
  .menu .mi { padding: 6px 10px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .menu .mi:hover { background: var(--hover); }
  .menu .chk { width: 14px; color: var(--accent); flex: none; }
  .menu .sep { height: 1px; background: var(--border); margin: 5px 4px; }
  /* Arbeitsbereich */
  #workspace { flex: 1; display: flex; min-height: 0; }
  #toolbar { width: 54px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
             padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; overflow-y: auto; }
  .toolbtn { width: 40px; height: 40px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--text);
             cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .toolbtn:hover { background: var(--hover); border-color: var(--border); }
  .tbsep { width: 28px; height: 1px; background: var(--border); margin: 3px 0; }
  #main { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  /* Rechtes Panel */
  #rightpanel { width: 360px; flex: none; background: var(--panel); border-left: 1px solid var(--border);
                display: flex; flex-direction: column; min-height: 0; }
  .panelhead { padding: 8px 12px; font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .panelhead .sp { flex: 1; }
  #layersPanel { display: flex; flex-direction: column; max-height: 42%; min-height: 120px; border-bottom: 1px solid var(--border); }
  #layersBody { overflow-y: auto; padding: 8px 10px; }
  #layerList { display: flex; flex-direction: column; gap: 4px; }
  .lrow { display: flex; align-items: center; gap: 6px; padding: 5px 7px; border: 1px solid var(--border);
          border-radius: 6px; font-size: 12.5px; cursor: pointer; background: var(--panel); }
  .lrow.sel { border-color: var(--accent); background: var(--hover); }
  .lrow .ln { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .ic { width: 22px; height: 24px; padding: 0; font-size: 13px; line-height: 1; border-radius: 5px; }
  #propsPanel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #propsForm { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  #editorBody { flex: 1; position: relative; min-height: 0; }
  .toolframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  .toolframe.active { display: block; }
  /* gemeinsame Inputs */
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  label:first-child { margin-top: 0; }
  select, input[type=text], input[type=number] { width: 100%; padding: 6px 8px; font-size: 13px;
             border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; }
  button { padding: 7px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { background: var(--hover); }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 6px; }
  .btnrow { display: flex; gap: 8px; margin-top: 8px; } .btnrow button { flex: 1; }
  #statusbar { flex: none; padding: 4px 12px; font-size: 11px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--border); }
  #hidden { display: none; }
</style>
</head>
<body>
<div id="menubar">
  <button class="menubtn" data-menu="file">Datei</button>
  <button class="menubtn" data-menu="edit">Bearbeiten</button>
  <button class="menubtn" data-menu="view">Ansicht</button>
  <span class="sp"></span>
  <a class="nav" href="../index.html" title="Home" data-icon="home"></a>
  <button class="tb" id="btnLang">EN</button>
  <button class="tb" id="btnTheme"></button>
</div>

<div id="workspace">
  <div id="toolbar"></div>
  <div id="main"><canvas id="cv"></canvas></div>
  <div id="rightpanel">
    <div id="layersPanel">
      <div class="panelhead">Ebenen</div>
      <div id="layersBody">
        <div id="layerList"></div>
        <div class="hint" id="layerHint">Noch keine Ebenen. Werkzeug links anklicken, um eine Ebene anzulegen, dann auf der Fläche ziehen.</div>
      </div>
    </div>
    <div id="propsPanel">
      <div class="panelhead">Eigenschaften <span class="sp"></span><span id="propLabel" style="font-weight:400;color:var(--muted)"></span></div>
      <div id="propsForm">
        <div id="selDetails" style="display:none">
          <div class="row">
            <div><label>X (mm)</label><input type="number" id="inLx" step="1"></div>
            <div><label>Y (mm)</label><input type="number" id="inLy" step="1"></div>
          </div>
          <div class="row">
            <div><label>Skalierung</label><input type="number" id="inLs" step="0.05" min="0.05"></div>
            <div><label>Drehung (°)</label><input type="number" id="inLr" step="1"></div>
          </div>
          <div class="btnrow"><button id="btnDup">Duplizieren</button><button id="btnDel">Löschen</button></div>
          <div class="hint">Eckgriffe = skalieren (Gegenecke fix; Alt/Cmd = Mitte). Kreis = drehen (Shift = 15°).</div>
        </div>
        <div class="hint" id="noSel">Keine Ebene ausgewählt. Werkzeug links wählen oder Ebene oben anklicken.</div>
      </div>
      <div id="editorBody"></div>
    </div>
  </div>
</div>
<div id="statusbar"><span id="stInfo">Bereit</span></div>

<div id="hidden">
  <input type="number" id="inMatW" value="300"><input type="number" id="inMatH" value="300">
  <select id="inPaper"><option value="none">keins</option><option value="A4P" selected>A4 hoch</option><option value="A4L">A4 quer</option><option value="A5P">A5 hoch</option><option value="A3P">A3 hoch</option><option value="Letter">Letter</option></select>
  <input type="checkbox" id="inSnap" checked>
  <input type="text" id="inFname" value="Komposition">
  <input type="file" id="fileLoad" accept=".handschrift,application/json">
</div>

<script src="configs.js"></script>
<script src="lac.js?v=4"></script>
<script src="ui.js?v=7"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");

const PAPERS = { none: null, A4P: [210, 297], A4L: [297, 210], A5P: [148, 210], A3P: [297, 420], Letter: [215.9, 279.4] };
const MISC_TOOLS = [["qr","QR-Code"],["spotify","Spotify-Code"],["svg","SVG-Import"],["paper","Papier / Raster"],
  ["pentest","Stift-Test"],["spacefill","Space-Filling-Kurven"],["spiro","Spirograph / Lissajous"],
  ["maze","Labyrinth"],["fxplot","Funktionsplotter"],["tsp","TSP- / Stipple-Art"],["wave","Audio-Waveform"]];
function toolLabel(t){ const m=MISC_TOOLS.find(x=>x[0]===t); return t==="model"?"3D-Modell":(m?m[1]:t); }

const S = { matW: 300, matH: 300, view: { scale: 1, ox: 0, oy: 0 }, layers: [], selId: null, paper: "A4P", snap: true };
let LID = 1;
let snapGuides = null;

function makeLayer(type, tool) {
  return { id: LID++, type, tool: tool || null, label: tool ? toolLabel(tool) : (type === "text" ? "Text" : "Bild"),
    visible: true, transform: { x: 40, y: 40, scale: 1, rot: 0 }, params: null,
    strokesCache: [], groups: null, cw: 0, ch: 0, _frame: null };
}
function embedUrl(L) {
  const base = L.type === "text" ? "index.html?embed=1" : L.type === "image" ? "bild.html?embed=1" : "misc.html?embed=1&tool=" + L.tool;
  return base + "&v=2";   // Cache-Bust für die eingebettete Tool-HTML
}

/* ---------- Transform-Math ---------- */
function layerMap(L) {
  const t = L.transform, sc = t.scale, rot = t.rot;
  const cx = t.x + (L.cw / 2) * sc, cy = t.y + (L.ch / 2) * sc;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  return ([px, py]) => { const X = t.x + px * sc, Y = t.y + py * sc, dx = X - cx, dy = Y - cy; return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos]; };
}
function layerCorners(L) { const f = layerMap(L); return [[0, 0], [L.cw, 0], [L.cw, L.ch], [0, L.ch]].map(f); }
function layerAABB(L) { const c = layerCorners(L); const xs = c.map(p => p[0]), ys = c.map(p => p[1]); return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) }; }
function pointInLayer(L, mx, my) {
  if (!L.cw || !L.ch) return false;
  const t = L.transform, sc = t.scale;
  const cx = t.x + (L.cw / 2) * sc, cy = t.y + (L.ch / 2) * sc;
  const cos = Math.cos(-t.rot), sin = Math.sin(-t.rot), dx = mx - cx, dy = my - cy;
  const Xr = cx + dx * cos - dy * sin, Yr = cy + dx * sin + dy * cos;
  const px = (Xr - t.x) / sc, py = (Yr - t.y) / sc;
  return px >= -1 && px <= L.cw + 1 && py >= -1 && py <= L.ch + 1;
}

/* ---------- Vorschau ---------- */
const mm2px = (x, y) => [(x * S.view.scale + S.view.ox) * devicePixelRatio, (y * S.view.scale + S.view.oy) * devicePixelRatio];
const px2mm = (x, y) => [(x - S.view.ox) / S.view.scale, (y - S.view.oy) / S.view.scale];
function groupColor(c, fallback) { if (!c) return fallback; const p = c.split(" "); return `rgb(${p[0]},${p[1]},${p[2]})`; }

function redraw() {
  const P = UI.palette();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.translate(S.view.ox, S.view.oy); ctx.scale(S.view.scale, S.view.scale);
  // Matte
  ctx.fillStyle = P.mat; ctx.strokeStyle = P.matBorder; ctx.lineWidth = 0.4;
  ctx.beginPath(); ctx.roundRect(0, 0, S.matW, S.matH, 3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = P.grid; ctx.lineWidth = 0.15; ctx.beginPath();
  for (let x = 10; x < S.matW; x += 10) { ctx.moveTo(x, 0); ctx.lineTo(x, S.matH); }
  for (let y = 10; y < S.matH; y += 10) { ctx.moveTo(0, y); ctx.lineTo(S.matW, y); }
  ctx.stroke();
  // Referenz-Blatt
  const pa = PAPERS[S.paper];
  if (pa) { const ox = (S.matW - pa[0]) / 2, oy = (S.matH - pa[1]) / 2;
    ctx.strokeStyle = P.frame; ctx.lineWidth = 0.4; ctx.setLineDash([3, 2]);
    ctx.strokeRect(ox, oy, pa[0], pa[1]); ctx.setLineDash([]); }
  // Layer
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 0.45;
  for (const L of S.layers) {
    if (!L.visible) continue;
    const f = layerMap(L);
    const groups = (L.groups && L.groups.length) ? L.groups : [{ color: null, polylines: L.strokesCache }];
    for (const g of groups) {
      ctx.strokeStyle = groupColor(g.color, P.ink);
      ctx.beginPath();
      for (const st of g.polylines) { if (st.length < 2) continue; const p0 = f(st[0]); ctx.moveTo(p0[0], p0[1]); for (let i = 1; i < st.length; i++) { const p = f(st[i]); ctx.lineTo(p[0], p[1]); } }
      ctx.stroke();
    }
  }
  // Snap-Guides
  if (snapGuides) { ctx.strokeStyle = P.marker; ctx.lineWidth = 0.3; ctx.beginPath();
    if (snapGuides.x != null) { ctx.moveTo(snapGuides.x, -1000); ctx.lineTo(snapGuides.x, S.matH + 1000); }
    if (snapGuides.y != null) { ctx.moveTo(-1000, snapGuides.y); ctx.lineTo(S.matW + 1000, snapGuides.y); }
    ctx.stroke(); }
  ctx.restore();
  // Auswahl-Box + Griffe (Screen-px)
  const L = sel();
  if (L && L.cw && L.ch) drawSelection(L, P);
}
function drawSelection(L, P) {
  const c = layerCorners(L).map(p => { const q = mm2px(p[0], p[1]); return [q[0] / devicePixelRatio, q[1] / devicePixelRatio]; });
  ctx.save();
  ctx.scale(devicePixelRatio, devicePixelRatio);   // Chrome in CSS-px zeichnen (sonst auf Retina verschoben/halb)
  ctx.strokeStyle = P.marker; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]); for (let i = 1; i < 4; i++) ctx.lineTo(c[i][0], c[i][1]); ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#fff"; ctx.strokeStyle = P.marker; ctx.lineWidth = 1.2;
  for (const p of c) { ctx.beginPath(); ctx.rect(p[0] - 4, p[1] - 4, 8, 8); ctx.fill(); ctx.stroke(); }
  // Rotate-Handle: über Mitte der oberen Kante
  const rh = rotateHandlePos(c);
  ctx.beginPath(); ctx.moveTo((c[0][0] + c[1][0]) / 2, (c[0][1] + c[1][1]) / 2); ctx.lineTo(rh[0], rh[1]); ctx.stroke();
  ctx.beginPath(); ctx.arc(rh[0], rh[1], 5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function rotateHandlePos(c) {
  const mx = (c[0][0] + c[1][0]) / 2, my = (c[0][1] + c[1][1]) / 2;
  let nx = (c[0][1] - c[3][1]), ny = -(c[0][0] - c[3][0]);   // Normale der oberen Kante nach außen
  const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
  return [mx + nx * 26, my + ny * 26];
}
function fitView() {
  const r = cv.getBoundingClientRect();
  const sc = Math.min(r.width / (S.matW + 40), r.height / (S.matH + 40));
  S.view.scale = sc; S.view.ox = (r.width - S.matW * sc) / 2; S.view.oy = (r.height - S.matH * sc) / 2;
  redraw();
}
function resize() { const r = $("main").getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; redraw(); }
window.addEventListener("resize", resize);
let rafP = 0; function scheduleRedraw() { if (rafP) return; rafP = requestAnimationFrame(() => { rafP = 0; redraw(); }); }

/* ---------- Auswahl & Drag ---------- */
function sel() { return S.layers.find(L => L.id === S.selId) || null; }
let drag = null;
cv.addEventListener("mousedown", e => {
  const [mx, my] = px2mm(e.offsetX, e.offsetY);
  const L = sel();
  if (L && L.cw && L.ch) {
    const c = layerCorners(L).map(p => { const q = mm2px(p[0], p[1]); return [q[0] / devicePixelRatio, q[1] / devicePixelRatio]; });
    const rh = rotateHandlePos(c);
    if (Math.hypot(e.offsetX - rh[0], e.offsetY - rh[1]) < 9) { const cen = center(L); drag = { mode: "rot", a0: Math.atan2(my - cen[1], mx - cen[0]), r0: L.transform.rot, cen }; return; }
    const wc = layerCorners(L), cen2 = center(L), lc = [[0, 0], [L.cw, 0], [L.cw, L.ch], [0, L.ch]];
    for (let i = 0; i < 4; i++) if (Math.hypot(e.offsetX - c[i][0], e.offsetY - c[i][1]) < 9) {
      const grab = wc[i], Ao = wc[(i + 2) % 4], oppL = lc[(i + 2) % 4];   // Ao = gegenüberliegende Ecke (Default-Anker)
      drag = { mode: "scale", s0: L.transform.scale, rot: L.transform.rot, Ao, Ac: cen2,
        oppOff: [oppL[0] - L.cw / 2, oppL[1] - L.ch / 2],
        d0o: Math.hypot(grab[0] - Ao[0], grab[1] - Ao[1]) || 1e-6, d0c: Math.hypot(grab[0] - cen2[0], grab[1] - cen2[1]) || 1e-6 };
      return;
    }
  }
  // Layer treffen (oben zuerst)
  for (let i = S.layers.length - 1; i >= 0; i--) { const Li = S.layers[i]; if (Li.visible && pointInLayer(Li, mx, my)) { selectLayer(Li.id); drag = { mode: "move", sx: mx, sy: my }; redraw(); return; } }
  // sonst: pan
  drag = { mode: "pan", sx: e.clientX, sy: e.clientY, ox: S.view.ox, oy: S.view.oy };
});
function center(L) { const t = L.transform; return [t.x + (L.cw / 2) * t.scale, t.y + (L.ch / 2) * t.scale]; }
window.addEventListener("mousemove", e => {
  if (!drag) return;
  if (drag.mode === "pan") { S.view.ox = drag.ox + (e.clientX - drag.sx); S.view.oy = drag.oy + (e.clientY - drag.sy); redraw(); return; }
  const r = cv.getBoundingClientRect();
  const [mx, my] = px2mm(e.clientX - r.left, e.clientY - r.top);
  const L = sel(); if (!L) return;
  if (drag.mode === "move") {
    L.transform.x += mx - drag.sx; L.transform.y += my - drag.sy; drag.sx = mx; drag.sy = my;
    snapGuides = null; if (S.snap && !e.shiftKey) snapMove(L);   // Shift gedrückt = Snapping aus
  } else if (drag.mode === "scale") {
    const alt = e.altKey || e.metaKey;          // Alt/Cmd: Mitte als Anker, sonst gegenüberliegende Ecke
    const A = alt ? drag.Ac : drag.Ao, off = alt ? [0, 0] : drag.oppOff, d0 = alt ? drag.d0c : drag.d0o;
    let s = drag.s0 * (Math.hypot(mx - A[0], my - A[1]) / d0);
    s = Math.max(0.05, Math.min(50, s));
    const cos = Math.cos(drag.rot), sin = Math.sin(drag.rot), ox = off[0] * s, oy = off[1] * s;
    const Cx = A[0] - (ox * cos - oy * sin), Cy = A[1] - (ox * sin + oy * cos);   // Center so, dass Anker fix bleibt
    L.transform.scale = s; L.transform.x = Cx - (L.cw / 2) * s; L.transform.y = Cy - (L.ch / 2) * s;
  } else if (drag.mode === "rot") {
    let rot = drag.r0 + (Math.atan2(my - drag.cen[1], mx - drag.cen[0]) - drag.a0);
    if (e.shiftKey) rot = Math.round(rot / (Math.PI / 12)) * (Math.PI / 12);
    L.transform.rot = rot;
  }
  syncSelInputs(); redraw();
});
window.addEventListener("mouseup", () => { if (drag) { snapGuides = null; redraw(); } drag = null; });
cv.addEventListener("wheel", e => { e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 1 / 1.12, ns = Math.min(40, Math.max(0.4, S.view.scale * f));
  S.view.ox = e.offsetX - (e.offsetX - S.view.ox) * ns / S.view.scale; S.view.oy = e.offsetY - (e.offsetY - S.view.oy) * ns / S.view.scale;
  S.view.scale = ns; redraw();
}, { passive: false });

function snapMove(L) {
  const tol = 4 / S.view.scale, bb = layerAABB(L);
  const probesX = [bb.minX, (bb.minX + bb.maxX) / 2, bb.maxX], probesY = [bb.minY, (bb.minY + bb.maxY) / 2, bb.maxY];
  const tx = [], ty = [];
  tx.push(0, S.matW / 2, S.matW); ty.push(0, S.matH / 2, S.matH);   // Build-Plate: Kanten + Mitte
  const pa = PAPERS[S.paper]; if (pa) { const ox = (S.matW - pa[0]) / 2, oy = (S.matH - pa[1]) / 2; tx.push(ox, ox + pa[0] / 2, ox + pa[0]); ty.push(oy, oy + pa[1] / 2, oy + pa[1]); }
  for (const o of S.layers) { if (o.id === L.id || !o.visible || !o.cw) continue; const a = layerAABB(o); tx.push(a.minX, (a.minX + a.maxX) / 2, a.maxX); ty.push(a.minY, (a.minY + a.maxY) / 2, a.maxY); }
  let bdx = null, gx = null, bdy = null, gy = null;
  for (const p of probesX) for (const t of tx) { const d = t - p; if (Math.abs(d) < tol && (bdx === null || Math.abs(d) < Math.abs(bdx))) { bdx = d; gx = t; } }
  for (const p of probesY) for (const t of ty) { const d = t - p; if (Math.abs(d) < tol && (bdy === null || Math.abs(d) < Math.abs(bdy))) { bdy = d; gy = t; } }
  if (bdx !== null) L.transform.x += bdx; if (bdy !== null) L.transform.y += bdy;
  snapGuides = { x: gx, y: gy };
}

/* ---------- Layer-Verwaltung ---------- */
function ensureFrame(L) {            // iframe erst bei Bedarf erzeugen (lazy)
  if (L._frame) return L._frame;
  const f = document.createElement("iframe"); f.className = "toolframe"; f.dataset.lid = L.id; f.src = embedUrl(L);
  if (L.params) L._pendingParams = L.params;
  $("editorBody").appendChild(f); L._frame = f; return f;
}
function addLayer(type, tool) {

}
function selectLayer(id) {

  if (L) ensureFrame(L);
  document.querySelectorAll(".toolframe").forEach(fr => fr.classList.toggle("active", L && L._frame && fr === L._frame));
  $("selDetails").style.display = L ? "" : "none";
  $("noSel").style.display = L ? "none" : "";
  $("propLabel").textContent = L ? L.label : "";
  if (L) syncSelInputs();
  renderList(); redraw();
}
function deleteLayer(id) {
  const i = S.layers.findIndex(L => L.id === id); if (i < 0) return;
  const L = S.layers[i]; if (L._frame) L._frame.remove(); S.layers.splice(i, 1);
  selectLayer(S.layers.length ? S.layers[Math.min(i, S.layers.length - 1)].id : null);
}
function duplicateLayer(id) {
  const L = S.layers.find(x => x.id === id); if (!L) return;
  const N = makeLayer(L.type, L.tool); N.transform = { x: L.transform.x + 6, y: L.transform.y + 6, scale: L.transform.scale, rot: L.transform.rot };
  N.strokesCache = L.strokesCache; N.groups = L.groups; N.cw = L.cw; N.ch = L.ch; N.params = L.params;
  S.layers.push(N); ensureFrame(N);
  selectLayer(N.id); renderList(); redraw();
}
function renderList() {
  const box = $("layerList"); box.innerHTML = "";
  $("layerHint").style.display = S.layers.length ? "none" : "";
  for (let i = S.layers.length - 1; i >= 0; i--) {
    const L = S.layers[i];
    const row = document.createElement("div"); row.className = "lrow" + (L.id === S.selId ? " sel" : "");
    const eye = document.createElement("button"); eye.className = "ic"; eye.textContent = L.visible ? "👁" : "🚫"; eye.title = "Sichtbar";
    eye.onclick = (ev) => { ev.stopPropagation(); L.visible = !L.visible; renderList(); redraw(); };
    const nm = document.createElement("span"); nm.className = "ln"; nm.textContent = L.label + (L.strokesCache.length ? "" : " (leer)");
    const up = document.createElement("button"); up.className = "ic"; up.textContent = "↑"; up.title = "nach oben";
    up.onclick = (ev) => { ev.stopPropagation(); if (i < S.layers.length - 1) { S.layers.splice(i, 1); S.layers.splice(i + 1, 0, L); renderList(); redraw(); } };
    const dn = document.createElement("button"); dn.className = "ic"; dn.textContent = "↓"; dn.title = "nach unten";
    dn.onclick = (ev) => { ev.stopPropagation(); if (i > 0) { S.layers.splice(i, 1); S.layers.splice(i - 1, 0, L); renderList(); redraw(); } };
    row.append(eye, nm, up, dn);
    row.onclick = () => { selectLayer(L.id); };
    box.appendChild(row);
  }
}

/* ---------- Speichern / Laden (.handschrift) ---------- */
function saveLayout() {
  const data = { format: "handschrift-studio", version: 1, matW: S.matW, matH: S.matH, paper: S.paper,
    layers: S.layers.map(L => ({ type: L.type, tool: L.tool, label: L.label, visible: L.visible,
      transform: L.transform, params: L.params, cw: L.cw, ch: L.ch,
      groups: L.groups, strokes: L.groups ? null : L.strokesCache })) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
  a.download = ($("inFname").value || "komposition") + ".handschrift"; a.click(); URL.revokeObjectURL(a.href);
}
function loadLayout(obj) {
  if (!obj || obj.format !== "handschrift-studio") { alert(UI.t("Keine gültige .handschrift-Datei.", "Not a valid .handschrift file.")); return; }
  S.layers.forEach(L => { if (L._frame) L._frame.remove(); }); S.layers = []; S.selId = null;
  S.matW = +obj.matW || 300; S.matH = +obj.matH || 300; S.paper = obj.paper || "none";
  $("inMatW").value = S.matW; $("inMatH").value = S.matH; $("inPaper").value = S.paper;
  for (const d of (obj.layers || [])) {
    const L = makeLayer(d.type, d.tool);
    L.label = d.label || L.label; L.visible = d.visible !== false;
    if (d.transform) L.transform = d.transform;
    L.params = d.params || null; L.cw = +d.cw || 0; L.ch = +d.ch || 0;
    L.groups = d.groups || null;
    L.strokesCache = L.groups ? L.groups.flatMap(g => g.polylines) : (d.strokes || []);
    S.layers.push(L);   // iframe wird erst beim Bearbeiten erzeugt (lazy)
  }
  $("selDetails").style.display = "none"; $("noSel").style.display = ""; $("propLabel").textContent = "";
  renderList(); fitView(); redraw();
  setStatus(S.layers.length + " " + UI.t("Layer geladen", "layers loaded"));
}
function syncSelInputs() { const L = sel(); if (!L) return; $("inLx").value = Math.round(L.transform.x); $("inLy").value = Math.round(L.transform.y); $("inLs").value = +L.transform.scale.toFixed(3); $("inLr").value = Math.round(L.transform.rot * 180 / Math.PI); }

/* ---------- Embed-Nachrichten von den Tool-iframes ---------- */
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.source !== "ttl-tool") return;
  const L = S.layers.find(x => x._frame && x._frame.contentWindow === e.source);
  if (!L) return;
  if (m.type === "ready") {
    if (L._pendingParams) { L._frame.contentWindow.postMessage({ source: "ttl-studio", type: "restoreParams", params: L._pendingParams }, "*"); L._pendingParams = null; }
    // Theme syncen
    L._frame.contentWindow.postMessage({ source: "ttl-studio", type: "setTheme", theme: UI.theme() }, "*");
  } else if (m.type === "strokes") {
    L.groups = m.groups || null;
    L.strokesCache = (m.groups && m.groups.length) ? m.groups.flatMap(g => g.polylines) : [];
    L.cw = m.cw || 0; L.ch = m.ch || 0; L.params = m.params;
    if (m.subtool && L.type !== "text") L.label = (L.type === "image" ? "Bild" : toolLabel(L.tool));
    scheduleRedraw(); renderList(); setStatus(S.layers.length + " Layer · ausgewählt: " + (sel() ? sel().label : "–"));
  }
});
function setStatus(t) { $("stInfo").textContent = t; }

/* ---------- Export ---------- */
function buildGroups() {
  const out = [];
  for (const L of S.layers) {
    if (!L.visible || !L.strokesCache.length) continue;
    const f = layerMap(L);
    const groups = (L.groups && L.groups.length) ? L.groups : [{ name: L.label, color: null, polylines: L.strokesCache }];
    groups.forEach(g => { const polys = g.polylines.map(st => st.map(f)).filter(st => st.length >= 2);
      if (polys.length) out.push({ name: L.label + (groups.length > 1 ? " — " + g.name : ""), color: g.color || undefined, strokes: polys }); });
  }
  return out;
}
function makeThumb() {
  return new Promise(res => {
    const c = document.createElement("canvas"); const sc = 512 / Math.max(S.matW, S.matH);
    c.width = Math.round(S.matW * sc); c.height = Math.round(S.matH * sc);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.scale(sc, sc);
    g.strokeStyle = "#16243d"; g.lineWidth = 0.45; g.lineCap = "round";
    for (const grp of buildGroups()) { g.beginPath(); for (const st of grp.strokes) { g.moveTo(st[0][0], st[0][1]); for (let i = 1; i < st.length; i++) g.lineTo(st[i][0], st[i][1]); } g.stroke(); }
    c.toBlob(b => b.arrayBuffer().then(buf => res(new Uint8Array(buf))), "image/png");
  });
}
async function exportLac() {
  const groups = buildGroups();
  if (!groups.length) { alert(UI.t("Keine sichtbaren Layer mit Inhalt.", "No visible layers with content.")); return; }
  const thumb = await makeThumb();
  const bytes = window.LacExport.makeLac(groups, { matW: S.matW, matH: S.matH, processType: "KCPenDraw", thumbnail: thumb });
  window.LacExport.download(bytes, ($("inFname").value || "komposition") + ".lac");
}
function exportSvg() {
  const groups = buildGroups(); if (!groups.length) { alert(UI.t("Keine sichtbaren Layer mit Inhalt.", "No visible layers with content.")); return; }
  let d = ""; for (const grp of groups) for (const st of grp.strokes) d += "M " + st.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" L ") + " ";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${S.matW}mm" height="${S.matH}mm" viewBox="0 0 ${S.matW} ${S.matH}"><g fill="none" stroke="#000" stroke-width="0.45" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></g></svg>`;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" })); a.download = ($("inFname").value || "komposition") + ".svg"; a.click(); URL.revokeObjectURL(a.href);
}
function newDoc() {
  if (S.layers.length && !confirm(UI.t("Neues Projekt — aktuelles Layout verwerfen?", "New project — discard current layout?"))) return;
  S.layers.forEach(L => { if (L._frame) L._frame.remove(); }); S.layers = []; selectLayer(null); fitView();
}
function setPaper(k) { S.paper = k; $("inPaper").value = k; redraw(); }
function toggleSnap() { S.snap = !S.snap; $("inSnap").checked = S.snap; }
function editMat() {
  const v = prompt(UI.t("Arbeitsfläche Breite × Höhe (mm)", "Work area width × height (mm)"), S.matW + " x " + S.matH);
  if (!v) return; const m = v.match(/([\d.]+)\s*[x×*,]\s*([\d.]+)/); if (!m) return;
  S.matW = +m[1] || 300; S.matH = +m[2] || 300; $("inMatW").value = S.matW; $("inMatH").value = S.matH; fitView();
}
function renameDoc() { const n = prompt(UI.t("Dateiname", "File name"), $("inFname").value); if (n != null) $("inFname").value = n.trim() || "Komposition"; }
function zoomBy(f) { const r = cv.getBoundingClientRect(), cxp = r.width / 2, cyp = r.height / 2, ns = Math.min(40, Math.max(0.4, S.view.scale * f)); S.view.ox = cxp - (cxp - S.view.ox) * ns / S.view.scale; S.view.oy = cyp - (cyp - S.view.oy) * ns / S.view.scale; S.view.scale = ns; redraw(); }

const TOOLBAR = [{ type: "text", label: "Text" }, { type: "image", label: "Bild" }, { type: "misc", tool: "model", label: "3D-Modell" }, { sep: 1 },

const dd = document.createElement("div"); dd.className = "menu"; $("menubar").appendChild(dd);
