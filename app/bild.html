<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bild-Plotter — weitergeleitet</title>
<script>
  // Der Bild-Plotter ist jetzt ein Ebenentyp im Layer Studio.
  // Query-Parameter erhalten und ?layer=image ergänzen (legt eine Bild-Ebene an).
  var q = new URLSearchParams(location.search);
  q.set("layer", "image");
  location.replace("index.html?" + q.toString());   // kein History-Eintrag
</script>
<meta http-equiv="refresh" content="0; url=index.html?layer=image">
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif;
         background: #f4f6f5; color: #1b201d; display: flex; min-height: 100vh;
         align-items: center; justify-content: center; padding: 24px; }
  a { color: #00ae42; }
</style>
</head>
<body>
<p>Der Bild-Plotter ist jetzt eine Bild-Ebene im Layer Studio —
<a href="index.html?layer=image">weiter zum Layer Studio</a>.</p>
</body>
</html>
